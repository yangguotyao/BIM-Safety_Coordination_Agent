papers:
  - {"id": "P01", "title": "Building Information Modeling (BIM) and Safety: Automatic Safety Checking of Construction Models and Schedules", "authors": ["Sijie Zhang", "Jochen Teizer", "Jin-Kook Lee", "Charles M. Eastman", "Manu Venugopal"], "year": 2013, "venue": "Automation in Construction", "doi": "10.1016/j.autcon.2012.05.006", "url": "https://www.sciencedirect.com/science/article/pii/S0926580512000799", "topic": "BIM安全规则检查基础", "summary_zh": "以建筑模型和施工计划进行自动安全规则检查，围绕坠落防护识别风险并提出预防措施。论文提供规则引擎与案例，说明空间和时间信息可以共同支持安全规划。适合借鉴几何计算、风险位置和规范依据的组织方式；不能把其案例结果当作本 Demo 的实测效果。", "reading_level": "摘要级", "relevance_1_5": 5, "preliminary_quality_0_10": 9, "verification": "Crossref题录已核验；全面撤稿审查未完成", "cite_key": "zhang_2013_p01", "fulltext_path": ""}
  - {"id": "P02", "title": "Ontology-based semantic modeling of construction safety knowledge: Towards automated safety planning for job hazard analysis (JHA)", "authors": ["Sijie Zhang", "Frank Boukamp", "Jochen Teizer"], "year": 2015, "venue": "Automation in Construction", "doi": "10.1016/j.autcon.2015.02.005", "url": "https://doi.org/10.1016/j.autcon.2015.02.005", "topic": "安全知识组织", "summary_zh": "将施工产品、施工过程和安全知识组织为关联本体，并探索与 BIM 的连接。研究通过专家访谈评估和 JHA 原型展示应用。适合指导危险源、活动、构件和控制措施的关联字段；首版不必复现完整本体系统。", "reading_level": "摘要级", "relevance_1_5": 5, "preliminary_quality_0_10": 8, "verification": "Crossref题录已核验；全面撤稿审查未完成", "cite_key": "zhang_2015_p02", "fulltext_path": ""}
  - {"id": "P03", "title": "BIM-integrated construction safety risk assessment at the design stage of building projects", "authors": ["Ying Lu", "Peizhen Gong", "Yuchun Tang", "Shuqi Sun", "Qiming Li"], "year": 2021, "venue": "Automation in Construction", "doi": "10.1016/j.autcon.2021.103553", "url": "https://www.sciencedirect.com/science/article/abs/pii/S0926580521000042", "topic": "风险评价边界", "summary_zh": "以可能性、后果和暴露三个维度组织设计阶段安全风险，结合事故与施工计划数据，通过 Revit 插件演示。适合说明暴露对象和活动信息为什么必须进入案例状态；本包没有相同标定数据，因此不复制其数值模型或宣称风险概率。", "reading_level": "摘要级", "relevance_1_5": 4, "preliminary_quality_0_10": 8, "verification": "Crossref题录已核验；全面撤稿审查未完成", "cite_key": "lu_2021_p03", "fulltext_path": ""}
  - {"id": "P04", "title": "BIM–LLM integration in AECO workflows: Applications, validation, and future directions", "authors": ["Ingeon Park", "Yije Kim", "Kyoungmin Kim", "Sangyoon Chin"], "year": 2026, "venue": "Automation in Construction", "doi": "10.1016/j.autcon.2026.106905", "url": "https://www.sciencedirect.com/science/article/abs/pii/S0926580526001469", "topic": "BIM与LLM研究定位", "summary_zh": "综述 BIM 与 LLM 在 AECO 工作流中的应用、验证及未来方向。用来组织 Demo 与已有工作的关系和验证边界。当前摘要级阅读不支撑对所有纳入研究或实验数据作独立判断。", "reading_level": "摘要级", "relevance_1_5": 5, "preliminary_quality_0_10": 7, "verification": "Crossref题录已核验；全面撤稿审查未完成", "cite_key": "park_2026_p04", "fulltext_path": ""}
  - {"id": "P05", "title": "AI BIM coordinator for non-expert interaction in building design using LLM-driven multi-agent systems", "authors": ["Yaxian Dong", "Zijun Zhan", "Yuqing Hu", "Daniel Mawunyo Doe", "Zhu Han"], "year": 2025, "venue": "Automation in Construction", "doi": "10.1016/j.autcon.2025.106563", "url": "https://www.sciencedirect.com/science/article/pii/S092658052500603X", "topic": "协调角色与操作日志", "summary_zh": "提出由多个 LLM 角色协同操作 BIM 工具并记录过程的 AI BIM coordinator，以 AutoGen–Revit 原型展示空间推理、构件创建、碰撞与视图操作。可以借鉴协调与检查角色、过程日志及视图联动。该研究侧重设计协调，本项目增加施工安全证据和整改复核，不把它描述为尚无人实现的 BIM Agent。", "reading_level": "摘要级", "relevance_1_5": 5, "preliminary_quality_0_10": 8, "verification": "Crossref题录已核验；全面撤稿审查未完成", "cite_key": "dong_2025_p05", "fulltext_path": ""}
  - {"id": "P06", "title": "Multi-agent framework for schema-guided reasoning and tool-augmented interaction with IFC models", "authors": ["Yan Gao", "Fuji Hu", "Chengzhang Chai", "Yiwei Weng", "Haijiang Li"], "year": 2026, "venue": "Automation in Construction", "doi": "10.1016/j.autcon.2026.106888", "url": "https://orca.cardiff.ac.uk/id/eprint/186047/", "topic": "IFC工具与结构引导", "summary_zh": "IFC-Agent 通过 IFC 模式引导、多 Agent 工具组合和缓存支持自然语言查询及多跳推理，并在 IFC 查询任务中评估。适合参考 GUID/STEP 关系导航和结构化工具结果。首版采用受控工具接口，不开放任意模型生成代码执行。", "reading_level": "摘要级", "relevance_1_5": 5, "preliminary_quality_0_10": 8, "verification": "Crossref题录已核验；全面撤稿审查未完成", "cite_key": "gao_2026_p06", "fulltext_path": "05_文献与技术资料/论文全文/P06_IFC_Agent.pdf"}
  - {"id": "P07", "title": "An interactive system for 3D spatial relationship query by integrating tree-based element indexing and LLM-based agent", "authors": ["Ang Li", "Peter Kok-Yiu Wong", "Xingyu Tao", "Jun Ma", "Jack C.P. Cheng"], "year": 2025, "venue": "Advanced Engineering Informatics", "doi": "10.1016/j.aei.2025.103375", "url": "https://doi.org/10.1016/j.aei.2025.103375", "topic": "空间索引参考", "summary_zh": "论文题名与 DOI 已由 Crossref 核对，主题为树形构件索引与 LLM Agent 的三维空间关系查询。可以作为空间查询层的进一步阅读入口。本次机构库下载出现重定向循环，未取得全文与可完整复核的摘要，因此不转述具体实验方法、指标或效果。", "reading_level": "题录级", "relevance_1_5": 4, "preliminary_quality_0_10": 5, "verification": "Crossref题录已核验；全面撤稿审查未完成", "cite_key": "li_2025_p07", "fulltext_path": ""}
  - {"id": "P08", "title": "BIM Information Extraction Through LLM-based Adaptive Exploration", "authors": ["Sylvain Hellin", "Suhyung Jang", "Stefan Fuchs", "Stavros Nousias", "André Borrmann"], "year": 2026, "venue": "预印本", "doi": "10.48550/arXiv.2605.01698", "url": "https://arxiv.org/abs/2605.01698", "topic": "IFC自适应查询", "summary_zh": "提出以运行时探索方式提取 BIM 信息，使 Agent 根据模型实际结构迭代调用代码，而非预设所有模型具有相同组织方式。作者使用 ifc-bench v2 对比自适应探索与静态查询生成。适合指导模型异质性与真实查询验收；其性能数字不等于本平台性能。", "reading_level": "摘要级", "relevance_1_5": 5, "preliminary_quality_0_10": 7, "verification": "arXiv题录与摘要已核验；全面撤稿审查未完成", "cite_key": "hellin_2026_p08", "fulltext_path": "05_文献与技术资料/论文全文/P08_2605.01698.pdf"}
  - {"id": "P09", "title": "Automatic Building Code Review: A Case Study", "authors": ["Hanlong Wan", "Weili Xu", "Michael Rosenberg", "Jian Zhang", "Aysha Siddika"], "year": 2025, "venue": "预印本", "doi": "10.48550/arXiv.2510.02634", "url": "https://arxiv.org/abs/2510.02634", "topic": "规则检索与确定性校验", "summary_zh": "结合 BIM 信息抽取、RAG 与 MCP 工具链研究建筑规范审查，并使用 COMcheck 等工具执行可审计检查。案例针对能耗规范，不能直接移植为中国施工安全条款。可借鉴条款解释与确定性检查分工，以及对模型差异的测试。", "reading_level": "摘要级", "relevance_1_5": 4, "preliminary_quality_0_10": 7, "verification": "arXiv题录与摘要已核验；全面撤稿审查未完成", "cite_key": "wan_2025_p09", "fulltext_path": "05_文献与技术资料/论文全文/P09_2510.02634.pdf"}
  - {"id": "P10", "title": "Building Information Models to Robot-Ready Site Digital Twins (BIM2RDT): An Agentic AI Safety-First Framework", "authors": ["Reza Akhavian", "Mani Amani", "Johannes Mootz", "Robert Ashe", "Behrad Beheshti"], "year": 2025, "venue": "预印本", "doi": "10.48550/arXiv.2509.20705", "url": "https://arxiv.org/abs/2509.20705", "topic": "多源现场数据扩展", "summary_zh": "BIM2RDT 连接 BIM 几何与语义、机器人视觉空间观测以及传感活动信息，研究安全优先的数字孪生。其配准与振动监测属于独立实验任务。适合放在扩展方向，首版不承诺点云配准、机器人导航或实时职业暴露监测。", "reading_level": "摘要级", "relevance_1_5": 4, "preliminary_quality_0_10": 7, "verification": "arXiv题录与摘要已核验；全面撤稿审查未完成", "cite_key": "akhavian_2025_p10", "fulltext_path": "05_文献与技术资料/论文全文/P10_2509.20705.pdf"}
  - {"id": "P11", "title": "ReAct: Synergizing Reasoning and Acting in Language Models", "authors": ["Shunyu Yao", "Jeffrey Zhao", "Dian Yu", "Nan Du", "Izhak Shafran", "Karthik Narasimhan", "Yuan Cao"], "year": 2022, "venue": "ICLR 2023；本包提供 arXiv 版本", "doi": "10.48550/arXiv.2210.03629", "url": "https://arxiv.org/abs/2210.03629", "topic": "Agent工具交互基础", "summary_zh": "ReAct 将任务执行中的信息获取与动作选择结合，通过外部环境或工具反馈改进多步任务表现。可参考有界工具调用、错误恢复和任务状态更新。平台展示实际工具调用记录和简短决策依据，不要求模型披露内部思维过程。", "reading_level": "摘要级", "relevance_1_5": 4, "preliminary_quality_0_10": 9, "verification": "arXiv题录与摘要已核验；全面撤稿审查未完成", "cite_key": "yao_2022_p11", "fulltext_path": "05_文献与技术资料/论文全文/P11_2210.03629.pdf"}
  - {"id": "P12", "title": "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks", "authors": ["Patrick Lewis", "Ethan Perez", "Aleksandra Piktus", "Fabio Petroni", "Vladimir Karpukhin", "Naman Goyal", "Heinrich Küttler", "Mike Lewis", "Wen-tau Yih", "Tim Rocktäschel", "Sebastian Riedel", "Douwe Kiela"], "year": 2020, "venue": "NeurIPS 2020；本包提供 arXiv 版本", "doi": "10.48550/arXiv.2005.11401", "url": "https://arxiv.org/abs/2005.11401", "topic": "RAG方法基础", "summary_zh": "提出将生成模型与外部检索记忆结合，研究知识密集型任务中的事实获取与生成。适合解释为什么规范条款应检索后引用，并保留来源与版本。检索增强本身不保证工程结论正确，仍需要几何和人工校验。", "reading_level": "摘要级", "relevance_1_5": 4, "preliminary_quality_0_10": 9, "verification": "arXiv题录与摘要已核验；全面撤稿审查未完成", "cite_key": "lewis_2020_p12", "fulltext_path": "05_文献与技术资料/论文全文/P12_2005.11401.pdf"}
